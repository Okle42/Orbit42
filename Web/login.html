<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit42 · 登入</title>
<style>
  :root { --bg:#0b0b0c; --card:rgba(20,20,22,.86); --line:#2a2a2d; --ink:#ededed; --dim:#8a8a8f; --acc:#ff3b30; --gold:#d9b45a; --ok:#9fbf9a; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f3f3f1; --card:rgba(255,255,255,.9); --line:#dcdcd8; --ink:#141414; --dim:#6e6e6e; --acc:#d7261b; --gold:#a8801f; --ok:#4f7a49; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px -apple-system, "PingFang TC", sans-serif; }
  body { display: grid; place-items: center;
    background-image: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--acc) 7%, transparent), transparent 55%),
      linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 100% 100%, 72px 72px, 72px 72px; background-position: center, -1px -1px, -1px -1px; }
  .card { width: min(560px, calc(100vw - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 28px 22px;
          backdrop-filter: blur(14px); box-shadow: 0 30px 80px rgba(0,0,0,.35); }
  .brand { font: 600 12px ui-monospace, Menlo, monospace; letter-spacing: .3em; }
  .brand b { color: var(--gold); font-weight: 600; }
  h1 { font-size: 22px; margin: 14px 0 4px; font-weight: 600; }
  .sub { color: var(--dim); margin: 0 0 20px; line-height: 1.5; }
  .row { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .logo { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font: 600 15px ui-monospace, Menlo, monospace; }
  .row.on .logo { border-color: var(--acc); color: var(--acc); }
  .nm { font-weight: 600; } .nm small { color: var(--dim); font-weight: 400; margin-left: 6px; }
  .st { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .row.on .st { color: var(--ok); }
  button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 16px; padding: 5px 14px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--dim); }
  button:disabled { opacity: .4; cursor: default; }
  button.acc { border-color: var(--acc); color: var(--acc); }
  .foot { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .foot .note { flex: 1; color: var(--dim); font-size: 12px; line-height: 1.5; }
  #enter { padding: 8px 20px; }
  .spin { display: inline-block; width: 10px; height: 10px; border: 1.5px solid var(--dim); border-top-color: transparent; border-radius: 50%; animation: r 0.8s linear infinite; vertical-align: -1px; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card" role="dialog" aria-labelledby="t">
  <div class="brand">ORBIT<b>42</b></div>
  <h1 id="t">用你的 AI 帳號登入</h1>
  <p class="sub">每一家都是用你自己的帳號和額度。登入後，那一家的 AI 就能變成球上的衛星。</p>
  <div id="list"><div class="row"><span></span><span class="st"><span class="spin"></span> 檢查中⋯</span><span></span></div></div>
  <div class="foot">
    <span class="note">Orbit42 不經手你的密碼或金鑰：登入走各家官方程式（會開瀏覽器到 Anthropic／OpenAI／Google 的登入頁）。</span>
    <button id="enter" class="acc" disabled>進入 Orbit42</button>
  </div>
</div>
<script>
const post = o => { try { window.webkit?.messageHandlers?.login?.postMessage(o); } catch {} };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LOGO = { claude: "C", codex: "G", gemini: "G", grok: "X" };
window.orbitAccounts = list => {
  document.getElementById("list").innerHTML = list.map(p => {
    let st, btn;
    if (!p.available) { st = "即將支援"; btn = `<button disabled>即將推出</button>`; }
    else if (!p.installed) { st = `還沒安裝 ${esc(p.company)} 的工具`; btn = p.install ? `<button data-act="install" data-id="${p.id}" title="${esc(p.install)}">安裝</button>` : `<button disabled>未安裝</button>`; }
    else if (p.signedIn) { st = `已登入${p.account ? " · " + esc(p.account) : ""}${p.plan ? " · " + esc(p.plan) : ""}`; btn = `<button data-act="login" data-id="${p.id}" title="換帳號／重新登入">重新登入</button>`; }
    else { st = "還沒登入"; btn = `<button class="acc" data-act="login" data-id="${p.id}">登入</button>`; }
    return `<div class="row${p.signedIn ? " on" : ""}"><span class="logo">${LOGO[p.id] || "·"}</span>
      <span><div class="nm">${esc(p.name)}<small>${esc(p.company)}</small></div><div class="st">${st}</div></span>${btn}</div>`;
  }).join("");
  document.getElementById("enter").disabled = !list.some(p => p.signedIn);
};
document.getElementById("list").onclick = e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  b.innerHTML = `<span class="spin"></span>`; post({ action: b.dataset.act, id: b.dataset.id });
};
document.getElementById("enter").onclick = () => post({ action: "enter" });
post({ action: "check" });
</script>
</body>
</html>
