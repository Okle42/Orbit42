<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>Orbit42</title>
<link rel="stylesheet" href="vendor/xterm-5.5.0/xterm.css">
<style>
  :root { --bg:#0b0b0c; --panel:rgba(18,18,20,.92); --line:#2a2a2d; --ink:#ededed; --dim:#8a8a8f; --acc:#4fc36a; --gold:#d9b45a; --term:#0d0d0f; }
  :root[data-theme="light"] { --bg:#fbfbf9; --panel:rgba(250,250,248,.94); --line:#d8d8d4; --ink:#141414; --dim:#6e6e6e; --acc:#d7261b; --gold:#a8801f; --term:#fbfbf9; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px -apple-system, "PingFang TC", sans-serif; overflow: hidden; }
  #gl { position: fixed; inset: 0; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px 0 84px;
         -webkit-app-region: drag; border-bottom: 1px solid var(--line); background: rgba(11,11,12,.6); backdrop-filter: blur(8px); z-index: 5; }
  .brand { font: 600 11px ui-monospace, Menlo, monospace; letter-spacing: .26em; }
  .brand b { color: var(--gold); font-weight: 600; }
  .brand .bdim { color: var(--dim); }   /* 11-23 Keng：品牌一定帶 OKLE42 署名 */
  .sp { flex: 1; }
  button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 14px; padding: 4px 11px; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.acc { border-color: var(--acc); color: var(--acc); }
  #menu, #bgMenu { position: fixed; top: 44px; right: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; display: none; z-index: 6; min-width: 220px; }
  #menu.on, #bgMenu.on { display: block; }
  .mi { display: flex; justify-content: space-between; gap: 12px; padding: 7px 10px; border-radius: 5px; cursor: pointer; }
  .mi:hover { background: var(--line); }
  .mi small { color: var(--dim); }
  .label { position: fixed; transform: translate(-50%, -150%); font-size: 11px; white-space: nowrap; pointer-events: none; color: var(--ink); text-shadow: 0 0 6px #000; }
  .label i { font-style: normal; color: var(--dim); margin-left: 4px; }
  .label.busy { color: #fff; } .label.exited { color: var(--dim); text-decoration: line-through; }
  #hint { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; color: var(--dim); font-size: 12px; pointer-events: none; }
  #panel { position: fixed; top: 40px; right: 0; bottom: 0; width: min(62vw, 980px); background: var(--term); border-left: 1px solid var(--line);
           transform: translateX(100%); transition: transform .28s ease; display: flex; flex-direction: column; z-index: 4; }
  #panel.on { transform: none; }
  #phead { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  #phead .nm { font-weight: 600; } #phead .st { color: var(--dim); font-size: 12px; }
  #terms { flex: 1; position: relative; }
  .term { position: absolute; inset: 8px 4px 4px 10px; display: none; }
  .term.on { display: block; }
  .term { overflow: hidden; }
  /* 11-24 iPhone 鏡像：靠下對齊（叫出鍵盤、畫面變矮時，切掉的是上面舊的，下面輸入列一定看得到） */
  body.mirror .term { top: auto; }
  .clawd { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 5; display: none; }   /* 11-23 Keng：取代 Claude Code 開頭的字元娃娃（動態夜視版） */
  /* ?term=1：嵌在 Orbit42 主視窗右邊當終端機面板（球體由 ShoWork 的完整球體負責） */
  body.termOnly #gl, body.termOnly #bar, body.termOnly #hint, body.termOnly #labels, body.termOnly #menu, body.termOnly #bgMenu { display: none !important; }
  body.termOnly #panel { top: 0; width: 100%; transform: none; transition: none; border-left: 0; }
  body.termOnly #phead { display: none; }
  /* 11-23 Keng：毛玻璃——網頁本身全透明，模糊由原生小視窗底層（NSVisualEffectView）做，終端機底色半透明（色票 background 帶 alpha） */
  html:has(body.termOnly), body.termOnly, body.termOnly #panel, body.termOnly #terms { background: transparent !important; }      /* 標題列和三顆燈由原生小視窗畫（可以拖動） */
  html:has(body.termOnly.lowdpi), body.termOnly.lowdpi, body.termOnly.lowdpi #panel, body.termOnly.lowdpi #terms { background: var(--term) !important; }   /* 11-23：1x 螢幕實色底（見 LOWDPI） */
  /* 11-23 Windows（WebView2）：預設捲軸是一條粗灰條 ⇒ 跟 Mac 一樣細、半透明，只在 Windows 生效 */
  html.win .xterm-viewport::-webkit-scrollbar { width: 8px; }
  html.win .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
  html.win .xterm-viewport::-webkit-scrollbar-thumb { background: rgba(128,128,128,.35); border-radius: 4px; }
  html.win .xterm-viewport::-webkit-scrollbar-button { display: none; }
</style>

<body>
<canvas id="gl"></canvas>
<div id="bar">
  <span class="brand">OKLE<b>42</b> <span class="bdim">· ORBIT<b>42</b></span></span>
  <span class="sp"></span>
  <button id="bBg" title="把正在背景跑的 Claude session 拉進來看">背景 session</button>

</div>

<script type="importmap">{ "imports": { "three": "./vendor/three-r170/three.module.min.js" } }</script>
<script type="module">
import * as THREE from "three";
const $ = id => document.getElementById(id);
const TERM_ONLY = new URLSearchParams(location.search).has("term");
// 11-23 iPhone App：鏡像模式（?mirror）＝照 Mac 那顆衛星的行列數顯示、字縮到塞得下手機寬度；不量自己的大小
// 11-24 起可以點、捲、打字（輸入走 "key" → App → Mac /api/input）
const MIRROR = new URLSearchParams(location.search).has("mirror");
let mirrorSize = null;
if (TERM_ONLY) document.body.classList.add("termOnly");
if (MIRROR) document.body.classList.add("mirror");
const post = o => { try { if (window.webkit?.messageHandlers?.orbit) window.webkit.messageHandlers.orbit.postMessage(o); else window.chrome?.webview?.postMessage(o); } catch {}   /* Windows：WebView2 */ };

/* ---------- 球體與衛星 ---------- */
const canvas = $("gl");
// 11-23 終端機模式（每顆衛星一個小視窗、各自一個網頁）不畫球體：不建 WebGL、不跑動畫迴圈，開很多個也不吃 GPU
const renderer = TERM_ONLY ? null : new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer?.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.set(0, 0, 11);
const root = new THREE.Group(); scene.add(root);
const ink = new THREE.Color("#ededed");
const accColor = () => new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue("--acc").trim() || "#4fc36a");   // 11-23 深色護眼綠、淺色紅
const lm = op => new THREE.LineBasicMaterial({ color: ink, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false });
root.add(new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(1.4, 3)), lm(0.12)));
const shell = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(1.75, 1)), lm(0.28)); root.add(shell);
const orbits = [];
for (let k = 0; k < 3; k++) {
  const ring = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(new THREE.EllipseCurve(0, 0, 2.6 + k * 0.55, 2.6 + k * 0.55).getPoints(128)), lm(0.18));
  const pv = new THREE.Group(); pv.rotation.set(1.2 + k * 0.18, k * 0.9, k * 0.5); pv.add(ring); root.add(pv); orbits.push(pv);
}
const sats = new Map();      // id → { data, mesh, halo, label, slot }
function satMesh() {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.13, 20, 14), new THREE.MeshBasicMaterial({ color: ink }));
  const h = new THREE.Mesh(new THREE.SphereGeometry(0.26, 20, 14), new THREE.MeshBasicMaterial({ color: ink, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false }));
  m.add(h); return { m, h };
}
window.orbitSats = list => {
  const keep = new Set(list.map(s => s.id));
  for (const [id, s] of sats) if (!keep.has(id)) { s.pv.removeFromParent(); s.label.remove(); sats.delete(id); dropTerm(id); }
  list.forEach((d, i) => {
    let s = sats.get(d.id);
    if (!s) {
      const { m, h } = satMesh(), pv = new THREE.Group();
      pv.rotation.copy(orbits[i % 3].rotation); pv.add(m); root.add(pv);
      const label = document.createElement("div"); label.className = "label"; $("labels").appendChild(label);
      s = { mesh: m, halo: h, pv, label, r: 2.6 + (i % 3) * 0.55, a: i * 2.4 };
      m.userData.id = d.id; sats.set(d.id, s);
    }
    s.data = d;
    s.label.className = "label " + d.state;
    s.label.innerHTML = `${esc(d.name)}<i>${{ busy: "工作中", open: "開著", idle: "還沒開", exited: "已結束" }[d.state] || ""}</i>`;
    if (d.id === active) paintHead();
  });
  $("hint").style.display = list.length ? "none" : "";
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function resize() { const w = innerWidth, h = innerHeight; renderer?.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener("resize", () => resize()); resize();      // 終端機的重新量交給下面的 ResizeObserver（停下來才量）
const clock = new THREE.Clock(), v = new THREE.Vector3();
(function frame() {
  if (TERM_ONLY) return;
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  root.rotation.y = Math.sin(t * 0.15) * 0.2; shell.rotation.y += dt * 0.12;
  // 終端機打開時球往左讓位
  const want = $("panel").classList.contains("on") ? -Math.min(3.2, camera.aspect * 2.2) : 0;
  root.position.x += (want - root.position.x) * Math.min(1, dt * 5);
  for (const s of sats.values()) {
    const busy = s.data.state === "busy";
    s.a += dt * (busy ? 0.9 : 0.35);
    s.mesh.position.set(Math.cos(s.a) * s.r, Math.sin(s.a) * s.r, 0);
    s.mesh.material.color.copy(s.data.state === "exited" ? new THREE.Color("#555") : busy ? accColor() : ink);
    s.halo.material.opacity = busy ? 0.3 + 0.15 * Math.sin(t * 6) : s.data.id === active ? 0.3 : 0.12;
    s.mesh.getWorldPosition(v).project(camera);
    s.label.style.left = ((v.x + 1) / 2 * innerWidth) + "px"; s.label.style.top = ((1 - v.y) / 2 * innerHeight) + "px";
    s.label.style.display = v.z > 1 ? "none" : "";
  }
  renderer.render(scene, camera);
})();

/* 點衛星 → 打開它的終端機 */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
canvas.addEventListener("click", e => {
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects([...sats.values()].flatMap(s => [s.mesh, s.halo]), false)[0];
  const id = hit && (hit.object.userData.id || hit.object.parent?.userData.id);
  if (id) openTerm(id);
});
canvas.addEventListener("mousemove", e => {
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(mouse, camera);
  canvas.style.cursor = ray.intersectObjects([...sats.values()].flatMap(s => [s.mesh, s.halo]), false).length ? "pointer" : "";
});

/* ---------- 終端機（每顆衛星一個 xterm，收起時保留畫面） ---------- */
const terms = new Map();     // id → { term, fit, el }
let active = null;
// 11-23 Keng「終端機好多種顏色，要符合我們的風格」：只留黑白灰＋紅 ⇒ 綠黃藍紫青改成不同深淺的灰
// Okle42 深／淺兩套色票（跟 Ghostty 的 Okle42-Dark／Okle42-Light 同一份）：Claude Code 的 okle42 樣式用 ANSI 色名，所以對話框跟著換
// 11-23 Keng：深色的紅全部改護眼綠（像軍用夜視綠，眼睛不疲勞）；淺色維持紅。Claude Code 的真彩色紅也經 okRGB 換成 THEME.red ⇒ 一起變綠
const THEMES = {
  dark: { background: "#0d0d0f1f", foreground: "#ededed", cursor: "#4fc36a", cursorAccent: "#0d0d0f", selectionBackground: "#173a20",
    black: "#1a1a1b", red: "#4fc36a", green: "#b0b0b0", yellow: "#e0e0e0", blue: "#9a9a9a", magenta: "#c8c8c8", cyan: "#bdbdbd", white: "#d4d4d4",
    brightBlack: "#5c5c5c", brightRed: "#7fd98f", brightGreen: "#c4c4c4", brightYellow: "#f0f0f0", brightBlue: "#ababab", brightMagenta: "#d6d6d6", brightCyan: "#cccccc", brightWhite: "#ffffff" },
  // 11-23 Keng「淺色看得好累」：淺色版提高對比——底稍微亮一點、一般字幾乎黑、灰字和各顏色都壓深到對比 4.5:1 以上
  light: { background: "#fbfbf91f", foreground: "#111111", cursor: "#d7261b", cursorAccent: "#ffffff", selectionBackground: "#f2c4bf",
    black: "#111111", red: "#c4211a", green: "#3a3a3a", yellow: "#2a2a2a", blue: "#4f4f4f", magenta: "#333333", cyan: "#444444", white: "#4a4a4a",
    brightBlack: "#555555", brightRed: "#d7261b", brightGreen: "#303030", brightYellow: "#222222", brightBlue: "#454545", brightMagenta: "#2e2e2e", brightCyan: "#3d3d3d", brightWhite: "#111111" },
};
const sysDark = matchMedia("(prefers-color-scheme: dark)");
let themeName = new URLSearchParams(location.search).get("theme") || (sysDark.matches ? "dark" : "light");
// 11-23 Keng（Xena3 轉達）「衛星終端機的字還是比面板糊」：WebGL 在透明底（#…1f）上畫字，反鋸齒是對著透明算的，
// 合成到 1x 螢幕上又細又糊 ⇒ 1x 螢幕改成實色底（不透明、不透出毛玻璃），WebGL 對著實色底做反鋸齒。Retina 維持半透明毛玻璃
const LOWDPI = (window.devicePixelRatio || 1) < 1.5;
if (LOWDPI) document.body.classList.add("lowdpi");
const solid = t => LOWDPI ? { ...t, background: t.background.slice(0, 7) } : t;
let THEME = solid(THEMES[themeName]);
// 深淺切換：系統外觀變了、或宿主（Orbit42 跟球體同步）指定
const t2031 = new Set();
window.orbitTheme = name => {
  const was = themeName;
  themeName = THEMES[name] ? name : (sysDark.matches ? "dark" : "light"); THEME = solid(THEMES[themeName]);
  document.documentElement.dataset.theme = themeName;
  for (const t of terms.values()) t.doll?.setColor(dollColor());
  for (const t of terms.values()) { t.term.options.theme = THEME; t.term.options.minimumContrastRatio = themeName === "dark" ? (LOWDPI ? 3 : 1) : 4.5; }
  if (was !== themeName) for (const id of t2031) post({ action: "input", id, data: `\x1b[?997;${themeName === "dark" ? 1 : 2}n` });
};
sysDark.addEventListener("change", () => { if (!new URLSearchParams(location.search).get("theme")) window.orbitTheme(); });
function makeTerm(id) {
  const el = document.createElement("div"); el.className = "term"; $("terms").appendChild(el);
  // 11-23 Keng（Xena3 轉達）「1080p 螢幕字有點糊」：1x 非 Retina 螢幕沒有次像素反鋸齒 ⇒ 字放大到 14、一般字用 500 粗細、
  // 最低對比提高（深色灰字會被拉亮），跟 Ghostty 那邊的調整一致；Retina 維持原樣
  const term = new Terminal({ fontFamily: '"SF Mono", Menlo, "PingFang TC", monospace', fontSize: LOWDPI ? 14 : 13, lineHeight: LOWDPI ? 1.2 : 1.15,
    fontWeight: LOWDPI ? "500" : "normal", fontWeightBold: LOWDPI ? "700" : "bold", theme: THEME,
    cursorBlink: true, allowProposedApi: true, allowTransparency: !LOWDPI, minimumContrastRatio: LOWDPI ? (themeName === "dark" ? 3 : 4.5) : (themeName === "dark" ? 1 : 4.5), scrollback: 10000, macOptionIsMeta: true });
  const fit = new FitAddon.FitAddon(); term.loadAddon(fit);
  try { term.loadAddon(new Unicode11Addon.Unicode11Addon()); term.unicode.activeVersion = "11"; } catch {}
  term.open(el);
  // 11-23 毛玻璃：之前 WebGL 在半透明底色（#…8c）留過殘影 ⇒ 小視窗改 DOM 繪圖。
  // 11-23 Keng「紅色線框右邊根本不是直線」：DOM 繪圖的「│」是普通字，行距 1.15 會斷、中文字寬誤差會左右歪 ⇒ 小視窗也改回 WebGL
  // （WebGL 自己畫框線字元，像素對齊、上下接得起來）。現在底色透明度 #…1f，實測轉圈覆寫＋捲動都沒有殘影；WebGL 掛掉就退回 DOM
  try { const gl = new WebglAddon.WebglAddon(); gl.onContextLoss(() => gl.dispose()); term.loadAddon(gl); } catch {}
  // 11-24 iPhone 鏡像也能打字、點擊：送 "key" 給 App（App 再轉給 Mac）。重播 Mac 的輸出時 xterm 會自動回答查詢
  // （游標位置、裝置屬性、焦點進出…），那些不是人打的，送回去會變成亂碼打進 Claude ⇒ 擋掉
  term.onData(data => { if (!MIRROR) return post({ action: "input", id, data }); if (!MIRROR_REPLY.test(data)) post({ action: "key", id, data }); });
  // 11-23：Claude Code 的「自動」主題會問終端機背景是什麼顏色（OSC 11／10）。xterm.js 預設不回答，
  // Claude Code 就當成深色背景、用白字 ⇒ 淺色模式下你送出的訊息、標籤都變成白字看不到。這裡照目前色票回答。
  const rgb = hex => { const h = hex.replace("#", ""); return [0, 2, 4].map(i => h.slice(i, i + 2)).map(x => x + x).join("/"); };
  const answer = (code, color) => (d) => { if (d.trim() === "?") post({ action: "input", id, data: `\x1b]${code};rgb:${rgb(color())}\x1b\\` }); return true; };
  term.parser.registerOscHandler(11, answer(11, () => THEME.background));
  term.parser.registerOscHandler(10, answer(10, () => THEME.foreground));
  // 較新的程式改問「顏色模式」（CSI ? 996 n，Ghostty／Kitty 都支援）：回 ?997;1n＝深色、?997;2n＝淺色
  term.parser.registerCsiHandler({ prefix: "?", final: "n" }, params => {
    if (params[0] !== 996) return false;
    post({ action: "input", id, data: `\x1b[?997;${themeName === "dark" ? 1 : 2}n` }); return true;
  });
  // 程式打開模式 2031（主題變了要通知）：記下來，切深淺時主動告訴它
  term.parser.registerCsiHandler({ prefix: "?", final: "h" }, params => { if (params.includes(2031)) t2031.add(id); return false; });
  term.parser.registerCsiHandler({ prefix: "?", final: "l" }, params => { if (params.includes(2031)) t2031.delete(id); return false; });
  term.onResize(({ cols, rows }) => post({ action: "resize", id, cols, rows }));
  const t = { term, fit, el, started: false }; terms.set(id, t); attachDoll(t); return t;
}
function dropTerm(id) { const t = terms.get(id); if (!t) return; clearInterval(t.dollTimer); t.doll?.stop(); t.term.dispose(); t.el.remove(); terms.delete(id); if (active === id) closePanel(); }
function openTerm(id) {
  const t = terms.get(id) || makeTerm(id);
