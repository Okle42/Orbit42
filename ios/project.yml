# Orbit42 iPhone App（連 Mac 上的 Orbit42：看球體、衛星畫面、回答答案卡）。產生專案：cd ios && xcodegen
name: Orbit42Phone
options:
  bundleIdPrefix: ai.okle42
  deploymentTarget:
    iOS: "17.0"
targets:
  Orbit42Phone:
    type: application
    platform: iOS
    sources:
      - Orbit42Phone
      - Shared
    # App 內建 Tailscale（TailscaleKit；不放進 git，做法見 ios/README.md）
    dependencies:
      - target: Orbit42Controls          # 11-24 控制中心按鈕
      - framework: Frameworks/TailscaleKit.framework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.okle42.orbit42.phone
        PRODUCT_NAME: Orbit42
        DEVELOPMENT_TEAM: "J79PXNQ765"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Orbit42Phone/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/Frameworks"
        # 一定要：不然一打開就 dyld 找不到 TailscaleKit 閃退（Ruby4 TS實測踩過）
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: 帶上網頁（球體、衛星終端機）
        script: |
          set -e
          OUT="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          ROOT="$SRCROOT/.."
          # 衛星終端機＝Orbit42 的 Web；球體＝Engine 的 Board/Web（跟 Mac build_app.sh 同一份）
          SW="$ROOT/Engine"
          mkdir -p "$OUT/OrbitWeb" "$OUT/Web"
          rsync -a --delete --exclude .DS_Store "$ROOT/Web/" "$OUT/OrbitWeb/"
          rsync -a --delete --exclude bench --exclude office.html --exclude office.js --exclude office.css --exclude office-w6.js --exclude kit.js --exclude demo-data.js --exclude scene/ --exclude ui/ --exclude .DS_Store --exclude '*.md' "${SPHERE_WEB:-$SW/windows/ShoWork.Win/Board/Web}/" "$OUT/Web/"
        basedOnDependencyAnalysis: false

  # 11-24 Keng：控制中心／鎖定畫面的「Orbit42 說話」按鈕（ControlWidget 要 iOS 18）
  Orbit42Controls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Orbit42Controls
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.okle42.orbit42.phone.controls
        PRODUCT_NAME: Orbit42Controls
        DEVELOPMENT_TEAM: "J79PXNQ765"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Orbit42Controls/Info.plist
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
