# Orbit42 iPhone App（連 Mac 上的 Orbit42：看球體、衛星畫面、回答答案卡）。產生專案：cd ios && xcodegen
name: Orbit42Phone
options:
  bundleIdPrefix: ai.okle42
  deploymentTarget:
    iOS: "17.0"
targets:
  Orbit42Phone:
    type: application
    platform: iOS
    sources:
      - Orbit42Phone
    # App 內建 Tailscale（TailscaleKit；不放進 git，做法見 ios/README.md）
    dependencies:
      - framework: Frameworks/TailscaleKit.framework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.okle42.orbit42.phone
        PRODUCT_NAME: Orbit42
        DEVELOPMENT_TEAM: "J79PXNQ765"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Orbit42Phone/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/Frameworks"
        # 一定要：不然一打開就 dyld 找不到 TailscaleKit 閃退（Ruby4 TS實測踩過）
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: 帶上網頁（球體、衛星終端機）
        script: |
          set -e
          OUT="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          ROOT="$SRCROOT/.."
          # 衛星終端機＝Orbit42 的 Web；球體＝ShoWork42 的 Board/Web（跟 Mac build_app.sh 同一個來源、同一個順序：暫時 swift package edit 時用 Packages/ShoWork42，平常用 GitHub 抓下來的）
          SW="$ROOT/Packages/ShoWork42"; [ -d "$SW" ] || SW="$ROOT/.build/checkouts/ShoWork42"
          mkdir -p "$OUT/OrbitWeb" "$OUT/Web"
          rsync -a --delete --exclude .DS_Store "$ROOT/Web/" "$OUT/OrbitWeb/"
          rsync -a --delete --exclude bench --exclude .DS_Store --exclude '*.md' "$SW/windows/ShoWork.Win/Board/Web/" "$OUT/Web/"
        basedOnDependencyAnalysis: false
